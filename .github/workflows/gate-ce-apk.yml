name: Build GATE CE APK
on:
  workflow_dispatch:
  push:
    paths: ["gate-ce-app/**", "gate-ce/index.html", "gate-ce/questions*.js", "gate-ce/version.js", "gate-ce/pyq/**", ".github/workflows/gate-ce-apk.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: gate-ce-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Bundle the web app into assets
        run: mkdir -p app/src/main/assets/www && cp -r ../gate-ce/index.html ../gate-ce/questions*.js ../gate-ce/version.js ../gate-ce/pyq app/src/main/assets/www/
      - run: gradle assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk GATE-CE-MockTest.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gate-ce-mocktest-apk
          path: gate-ce-app/GATE-CE-MockTest.apk
      - name: Publish APK next to the web app (download link on the exam home page)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          cp GATE-CE-MockTest.apk ../gate-ce/GATE-CE-MockTest.apk
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add gate-ce/GATE-CE-MockTest.apk
          git diff --cached --quiet || git commit -m "Update GATE CE APK [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"
