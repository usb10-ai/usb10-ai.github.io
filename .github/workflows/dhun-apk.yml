name: Build Dhun APK
on:
  workflow_dispatch:
  push:
    paths: ["dhun-app/**", "dhun/index.html", "dhun/engine.js", ".github/workflows/dhun-apk.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dhun-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Bundle the web app into assets
        run: mkdir -p app/src/main/assets/www && cp ../dhun/index.html ../dhun/engine.js app/src/main/assets/www/
      - run: gradle assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk Dhun.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dhun-apk
          path: dhun-app/Dhun.apk
      - name: Publish APK next to the web app (download link on the Dhun page)
        run: |
          cp Dhun.apk ../dhun/Dhun.apk
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add dhun/Dhun.apk
          git diff --cached --quiet || git commit -m "Update Dhun APK [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"
