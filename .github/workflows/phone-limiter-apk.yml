name: Build Phone Limiter APK
on:
  workflow_dispatch:
  push:
    paths: ["phone-limiter/**"]
permissions:
  contents: write   # publish the APK as a release so the app can update itself
concurrency: phone-limiter-release
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: phone-limiter } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - run: gradle testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: phone-limiter-debug-apk
          path: phone-limiter/app/build/outputs/apk/debug/app-debug.apk
      # The app's "Check for updates" reads version.json and downloads app-debug.apk from this release.
      - name: Publish in-app update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk phone-limiter.apk
          echo "{\"versionCode\": ${GITHUB_RUN_NUMBER}, \"versionName\": \"build ${GITHUB_RUN_NUMBER}\"}" > version.json
          gh release delete phone-limiter-latest --yes --cleanup-tag || true
          gh release create phone-limiter-latest phone-limiter.apk version.json \
            --target "$GITHUB_SHA" --prerelease \
            --title "Phone Limiter build ${GITHUB_RUN_NUMBER}" \
            --notes "Latest Phone Limiter APK. The app updates itself from here (Settings > App updates)."
