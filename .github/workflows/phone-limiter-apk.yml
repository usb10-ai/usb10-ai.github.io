name: Build Phone Limiter APK
on:
  workflow_dispatch:
  push:
    paths: ["phone-limiter/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: phone-limiter } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - run: gradle testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: phone-limiter-debug-apk
          path: phone-limiter/app/build/outputs/apk/debug/app-debug.apk
