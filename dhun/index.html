<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dhun — Music</title>
<meta name="description" content="Dhun is a free music app: original built-in songs composed on your device, free music from the Internet Archive, your own files, playlists, likes, radio and a queue.">
<meta name="theme-color" content="#0e0d10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff5f6d'/%3E%3Cstop offset='1' stop-color='%23ffc371'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='url(%23g)'/%3E%3Cpath d='M24 20v24l20-12z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0d10; --bg-2:#151418; --surface:#1d1b21; --surface-2:#26232b; --hover:rgba(255,255,255,.07); --press:rgba(255,255,255,.12);
  --ink:#f5f3f7; --ink-soft:#b3adb9; --ink-faint:#7d7783; --line:rgba(255,255,255,.09);
  --accent:#ff6a5c; --accent-2:#ffb35c; --accent-ink:#1a0d0b; --like:#ff5f7a;
  --grad:linear-gradient(135deg,#ff5f6d,#ffc371);
  --shadow:0 12px 40px rgba(0,0,0,.5);
  --bar-h:76px; --top-h:64px; --side-w:232px; --nav-h:58px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#faf8fb; --bg-2:#f2eff4; --surface:#ffffff; --surface-2:#ece8ef; --hover:rgba(20,10,30,.06); --press:rgba(20,10,30,.11);
    --ink:#1b1820; --ink-soft:#5f5866; --ink-faint:#8f8896; --line:rgba(20,10,30,.1);
    --accent:#e2483c; --accent-2:#e88a1a; --accent-ink:#fff; --like:#e23d5c; --shadow:0 12px 40px rgba(40,20,60,.18);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#faf8fb; --bg-2:#f2eff4; --surface:#ffffff; --surface-2:#ece8ef; --hover:rgba(20,10,30,.06); --press:rgba(20,10,30,.11);
  --ink:#1b1820; --ink-soft:#5f5866; --ink-faint:#8f8896; --line:rgba(20,10,30,.1);
  --accent:#e2483c; --accent-2:#e88a1a; --accent-ink:#fff; --like:#e23d5c; --shadow:0 12px 40px rgba(40,20,60,.18);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg{display:block}
.ic{width:24px;height:24px;fill:currentColor;flex:none}
.ic.sm{width:20px;height:20px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:10px;border:2px solid var(--bg)}::-webkit-scrollbar-track{background:transparent}

#app{display:grid;height:100%;height:100dvh;grid-template-columns:var(--side-w) 1fr;grid-template-rows:var(--top-h) 1fr auto;grid-template-areas:"top top" "side main" "bar bar"}
/* top bar */
#top{grid-area:top;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--bg);z-index:5}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em;min-width:calc(var(--side-w) - 36px)}
.logo-mark{width:30px;height:30px;border-radius:50%;background:var(--grad);display:grid;place-items:center;box-shadow:0 2px 12px rgba(255,95,109,.4)}
.logo-mark svg{width:16px;height:16px;fill:#fff;margin-left:2px}
.search{flex:1;max-width:560px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:42px;color:var(--ink-soft)}
.search:focus-within{border-color:var(--ink-faint);background:var(--surface-2)}
.search input{flex:1;background:none;border:0;outline:0;height:100%;min-width:0}
.search input::placeholder{color:var(--ink-faint)}
.top-actions{margin-left:auto;display:flex;gap:4px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink-soft);flex:none}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.icon-btn:active{background:var(--press)}
.icon-btn.on{color:var(--accent)}
.icon-btn:disabled{opacity:.35;pointer-events:none}
#searchToggle,#backBtn{display:none}

/* side */
#side{grid-area:side;padding:12px 8px;overflow-y:auto;border-right:1px solid var(--line)}
.nav a{display:flex;align-items:center;gap:18px;padding:0 16px;height:48px;border-radius:10px;font-weight:600;color:var(--ink-soft)}
.nav a:hover{background:var(--hover);color:var(--ink)}
.nav a.active{background:var(--surface);color:var(--ink)}
.side-sep{height:1px;background:var(--line);margin:12px 8px}
.new-pl{display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 16px);margin:4px 8px 12px;height:40px;border-radius:20px;background:var(--surface);font-weight:600}
.new-pl:hover{background:var(--surface-2)}
.side-pl a{display:block;padding:8px 16px;border-radius:8px}
.side-pl a:hover{background:var(--hover)}
.side-pl a b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-pl a span{font-size:13px;color:var(--ink-faint)}

/* main */
#main{grid-area:main;overflow-y:auto;overflow-x:hidden;position:relative;scroll-behavior:auto}
#view{padding:20px 40px 48px;max-width:1500px;margin:0 auto;min-height:100%}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 26px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:9px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip:hover{background:var(--surface-2)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.shelf{margin:8px 0 40px}
.shelf-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:16px}
.shelf-head .kicker{font-size:13px;color:var(--ink-faint);font-weight:600;letter-spacing:.02em}
.shelf-head h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.shelf-head .grow{flex:1;min-width:0}
.shelf-head .more{display:inline-flex;align-items:center;white-space:nowrap;height:34px;padding:0 14px;border:1px solid var(--line);border-radius:17px;font-weight:600;font-size:14px;color:var(--ink-soft)}
.shelf-head .more:hover{background:var(--hover);color:var(--ink)}
.scroller{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding-bottom:4px}
.scroller::-webkit-scrollbar{display:none}
.card{flex:none;width:180px;scroll-snap-align:start;cursor:pointer;min-width:0}
.card .art{position:relative;width:100%;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--surface)}
.card.round .art{border-radius:50%}
.card .art img{width:100%;height:100%;object-fit:cover;display:block}
.card .art .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.5));opacity:0;transition:opacity .15s}
.card:hover .art .shade{opacity:1}
.card .play-fab{position:absolute;right:10px;bottom:10px;width:44px;height:44px;border-radius:50%;background:rgba(15,12,18,.75);color:#fff;display:grid;place-items:center;opacity:0;transform:translateY(6px);transition:.15s;backdrop-filter:blur(6px)}
.card .play-fab:hover{background:var(--accent);color:var(--accent-ink);transform:scale(1.06)}
.card:hover .play-fab,.card:focus-within .play-fab{opacity:1;transform:none}
.card.round .play-fab{right:50%;bottom:50%;transform:translate(50%,50%)}
.card .t{margin-top:10px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.round .t,.card.round .s{text-align:center}
.card .s{margin-top:3px;color:var(--ink-soft);font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mix-label{position:absolute;left:12px;right:12px;bottom:12px;color:#fff;font-weight:800;font-size:22px;line-height:1.05;letter-spacing:-.02em;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.mix-label small{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85;margin-bottom:4px}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:28px 20px}
.grid-cards .card{width:auto}

/* quick picks */
.qp{display:grid;grid-auto-flow:column;grid-template-rows:repeat(4,auto);grid-auto-columns:minmax(320px,1fr);gap:4px 20px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
.qp::-webkit-scrollbar{display:none}
.qp .row{scroll-snap-align:start}

/* track rows */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:6px 8px;border-radius:8px;min-height:60px;cursor:pointer;position:relative}
.row:hover{background:var(--hover)}
.row .thumb{position:relative;width:48px;height:48px;border-radius:5px;overflow:hidden;flex:none;background:var(--surface)}
.row .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.row .thumb .ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);color:#fff;opacity:0}
.row:hover .thumb .ov,.row.cur .thumb .ov{opacity:1}
.row .num{width:28px;text-align:center;color:var(--ink-faint);font-variant-numeric:tabular-nums;flex:none}
.row .meta{flex:1;min-width:0}
.row .meta .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta .s{font-size:14px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row.cur .meta .t{color:var(--accent)}
.row .album-col{flex:0 1 30%;min-width:0;color:var(--ink-soft);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .dur{color:var(--ink-faint);font-size:14px;font-variant-numeric:tabular-nums;width:46px;text-align:right;flex:none}
.row .acts{display:flex;align-items:center;flex:none}
.row .acts .icon-btn{width:36px;height:36px}
.row .like-btn{opacity:0}
.row:hover .like-btn,.row .like-btn.on,.row:focus-within .like-btn{opacity:1}
.like-btn.on{color:var(--like)}
.src-badge{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;padding:1px 5px;border-radius:4px;background:var(--surface-2);color:var(--ink-soft);margin-right:6px;vertical-align:1px}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:currentColor;border-radius:1px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.7s}
.paused .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}

/* page header (album/artist/playlist) */
.hero{display:flex;gap:32px;align-items:flex-end;margin:12px 0 28px}
.hero .cover{width:240px;height:240px;border-radius:10px;overflow:hidden;flex:none;box-shadow:var(--shadow);background:var(--surface);position:relative}
.hero.round .cover{border-radius:50%}
.hero .cover img{width:100%;height:100%;object-fit:cover}
.hero .info{min-width:0;flex:1}
.hero .kind{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.hero h1{margin:6px 0 10px;font-size:44px;line-height:1.05;letter-spacing:-.03em;font-weight:800;word-break:break-word}
.hero .sub{color:var(--ink-soft);line-height:1.5}
.hero .sub a{font-weight:600;color:var(--ink)}
.hero .sub a:hover{text-decoration:underline}
.hero .desc{color:var(--ink-soft);margin-top:8px;max-width:640px;line-height:1.5}
.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;align-items:center}
.btn{height:40px;padding:0 18px;border-radius:20px;font-weight:700;display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);white-space:nowrap}
.btn:hover{filter:brightness(1.12)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn .ic{width:20px;height:20px}
.page-title{font-size:32px;font-weight:800;letter-spacing:-.03em;margin:8px 0 18px}
.empty{padding:48px 20px;text-align:center;color:var(--ink-soft);border:1px dashed var(--line);border-radius:14px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.empty .btn{margin-top:16px}
.note{color:var(--ink-faint);font-size:13px;line-height:1.5}
.note a{text-decoration:underline}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--surface-2);border-top-color:var(--accent);animation:spin .8s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* moods grid */
.moods{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:40px}
.mood{height:56px;border-radius:10px;background:var(--surface);display:flex;align-items:center;padding:0 16px;font-weight:700;position:relative;overflow:hidden;border-left:6px solid var(--c)}
.mood:hover{background:var(--surface-2)}
.ia-box{background:var(--bg-2);border:1px solid var(--line);border-radius:16px;padding:22px}
.ia-search{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ia-search .search{max-width:none}

/* bottom bar */
#bar{grid-area:bar;height:var(--bar-h);background:var(--surface);position:relative;display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,1.4fr) minmax(220px,1fr);align-items:center;padding:0 16px;gap:16px;z-index:6;border-top:1px solid var(--line)}
#bar.empty-bar{display:none}
.seek-top{position:absolute;left:0;right:0;top:-7px;height:14px;cursor:pointer;display:flex;align-items:center}
.seek-top .track{position:relative;width:100%;height:3px;background:var(--surface-2);transition:height .1s}
.seek-top:hover .track{height:5px}
.seek-top .buf{position:absolute;left:0;top:0;bottom:0;background:var(--press)}
.seek-top .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.seek-top .knob{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%) scale(0);transition:transform .1s}
.seek-top:hover .knob,.seek-top.drag .knob{transform:translate(-50%,-50%) scale(1)}
.ctrl{display:flex;align-items:center;gap:6px}
.ctrl .play{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.ctrl .play .ic{width:34px;height:34px}
.ctrl .play:hover{background:var(--hover)}
.time{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums;margin-left:8px;white-space:nowrap}
.now{display:flex;align-items:center;gap:14px;min-width:0;justify-content:center}
.now .thumb{width:48px;height:48px;border-radius:5px;overflow:hidden;flex:none;cursor:pointer;background:var(--surface-2);position:relative}
.now .thumb img{width:100%;height:100%;object-fit:cover}
.now .meta{min-width:0;cursor:pointer}
.now .meta .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .meta .s{color:var(--ink-soft);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{display:flex;align-items:center;justify-content:flex-end;gap:2px}
.vol{display:flex;align-items:center}
.vol input{width:92px;accent-color:var(--ink)}
.loading-ring{position:absolute;inset:0;display:none;place-items:center;background:rgba(0,0,0,.45)}
.loading .loading-ring{display:grid}
.loading-ring::after{content:"";width:22px;height:22px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .8s linear infinite}

/* bottom nav (mobile) */
#nav{display:none}

/* now playing */
#np{position:fixed;left:0;right:0;top:var(--top-h);bottom:var(--bar-h);background:var(--bg);z-index:4;transform:translateY(102%);transition:transform .28s cubic-bezier(.3,.7,.2,1);visibility:hidden;overflow:hidden}
#np.open{transform:none;visibility:visible}
.np-bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(60px) saturate(1.3);opacity:.35;transform:scale(1.1)}
.np-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent,var(--bg) 85%)}
.np-inner{position:relative;height:100%;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,1fr);gap:48px;padding:32px 48px 24px;max-width:1500px;margin:0 auto}
.np-head{display:none}
.np-left{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;gap:18px}
.np-art{position:relative;width:min(100%,62vh,620px);aspect-ratio:1;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);background:var(--surface)}
.np-art img{width:100%;height:100%;object-fit:cover;display:block}
#viz{position:absolute;left:0;right:0;bottom:0;width:100%;height:34%;pointer-events:none}
.np-mobile{display:none}
.np-right{display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;height:48px;font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.tab-body{overflow-y:auto;flex:1;min-height:0;padding:8px 0}
.qhead{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 6px;color:var(--ink-soft);font-size:14px}
.qhead b{color:var(--ink)}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;color:var(--ink-soft);font-size:14px}
.switch input{appearance:none;width:36px;height:20px;border-radius:10px;background:var(--surface-2);position:relative;cursor:pointer;margin:0;transition:.15s}
.switch input::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--ink-soft);transition:.15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:19px;background:#fff}
.about{padding:16px 8px;line-height:1.6;color:var(--ink-soft)}
.about dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0}
.about dt{color:var(--ink-faint)}.about dd{margin:0;color:var(--ink)}

/* menu & dialogs */
#scrim{position:fixed;inset:0;z-index:40;display:none}
#scrim.dim{background:rgba(0,0,0,.5)}
#menu{position:fixed;z-index:41;min-width:250px;max-width:320px;background:var(--surface-2);border-radius:10px;box-shadow:var(--shadow);padding:8px 0;display:none;max-height:80vh;overflow-y:auto}
#menu .mh{display:flex;gap:12px;align-items:center;padding:6px 16px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
#menu .mh img{width:44px;height:44px;border-radius:5px;object-fit:cover}
#menu .mh b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menu .mh span{font-size:13px;color:var(--ink-soft)}
#menu .mh div{min-width:0}
#menu button{display:flex;align-items:center;gap:16px;width:100%;height:44px;padding:0 18px;text-align:left;font-weight:500}
#menu button:hover{background:var(--hover)}
#menu button .ic{color:var(--ink-soft)}
#menu .sep{height:1px;background:var(--line);margin:6px 0}
#dialog{position:fixed;z-index:42;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100vw - 32px));max-height:80vh;display:none;flex-direction:column;background:var(--surface);border-radius:16px;box-shadow:var(--shadow)}
#dialog h3{margin:0;padding:20px 22px 8px;font-size:20px}
#dialog .db{padding:8px 22px;overflow-y:auto}
#dialog .df{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px 18px}
#dialog .field{width:100%;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--bg-2);padding:0 14px;outline:0}
#dialog .field:focus{border-color:var(--accent)}
.pl-pick{display:flex;align-items:center;gap:14px;width:100%;padding:8px;border-radius:8px;text-align:left}
.pl-pick:hover{background:var(--hover)}
.pl-pick .pa{width:44px;height:44px;border-radius:6px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;flex:none}
.pl-pick .pa img{width:100%;height:100%;object-fit:cover}
.pl-pick span{color:var(--ink-faint);font-size:13px;display:block}
#toast{position:fixed;left:50%;bottom:calc(var(--bar-h) + 18px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:8px;font-weight:600;z-index:50;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100vw - 32px);display:flex;gap:14px;align-items:center}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:var(--accent);font-weight:800}
.drop{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:none;place-items:center;color:#fff;font-size:22px;font-weight:800;border:3px dashed var(--accent)}
.drop.on{display:grid}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- tablet ---------- */
@media (max-width:1100px){
  #view{padding:16px 24px 40px}
  .np-inner{gap:28px;padding:24px}
  #bar{grid-template-columns:auto minmax(0,1fr) auto}
  .vol input{display:none}
  .row .album-col{display:none}
}
/* ---------- phone ---------- */
@media (max-width:760px){
  :root{--top-h:56px;--bar-h:64px}
  #app{grid-template-columns:1fr;grid-template-rows:var(--top-h) 1fr auto var(--nav-h);grid-template-areas:"top" "main" "bar" "nav"}
  #side{display:none}
  #top{padding:0 8px 0 16px;gap:8px;padding-top:env(safe-area-inset-top)}
  .logo{min-width:0}
  #top .search{display:none}
  #top.searching .logo,#top.searching .top-actions{display:none}
  #top.searching .search{display:flex}
  #top.searching #backBtn{display:grid}
  #searchToggle{display:grid}
  #view{padding:12px 16px 32px}
  .card{width:148px}
  .shelf-head h2{font-size:21px}
  .grid-cards{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:22px 14px}
  .qp{grid-auto-columns:86%}
  .hero{flex-direction:column;align-items:center;text-align:center;gap:18px}
  .hero .cover{width:200px;height:200px}
  .hero h1{font-size:30px}
  .actions{justify-content:center}
  .row .dur{display:none}
  .row .like-btn{display:none}
  #nav{grid-area:nav;display:flex;background:var(--bg-2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
  #nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--ink-faint)}
  #nav a.active{color:var(--ink)}
  /* mini player */
  #bar{height:var(--bar-h);grid-template-columns:minmax(0,1fr) auto;padding:0 8px 0 10px;gap:6px;margin:0 6px 6px;border-radius:10px;border:0;background:var(--surface-2)}
  #bar .ctrl .seek-ish,#bar .time,#bar .right .hide-m,#bar .ctrl .prev{display:none}
  #bar .now{order:-1;justify-content:flex-start;gap:10px}
  #bar .ctrl{gap:0}
  #bar .ctrl .play .ic{width:30px;height:30px}
  #bar .right,#bar .now .hide-m{display:none}
  .seek-top{top:auto;bottom:0;left:10px;right:10px;height:2px;pointer-events:none}
  .seek-top .track{height:2px!important;background:rgba(255,255,255,.12)}
  .seek-top .knob{display:none}
  #np{top:0;bottom:0;z-index:30;overflow-y:auto;padding-top:env(safe-area-inset-top)}
  .np-inner{display:block;padding:0 20px 24px;height:auto}
  .np-head{display:flex;align-items:center;justify-content:space-between;height:56px;margin:0 -8px}
  .np-head span{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
  .np-art{width:100%;max-width:440px;margin:6px auto 0}
  .np-left{display:block}
  .np-mobile{display:block;max-width:440px;margin:22px auto 0}
  .np-right{margin-top:26px;min-height:60vh}
  .tab-body{overflow:visible}
  #toast{bottom:calc(var(--bar-h) + var(--nav-h) + 16px)}
  #menu{left:0!important;right:0;bottom:0;top:auto!important;max-width:none;border-radius:16px 16px 0 0;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
}
.npm-title{display:flex;align-items:center;gap:8px}
.npm-title .meta{flex:1;min-width:0}
.npm-title .t{font-size:22px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npm-title .s{color:var(--ink-soft);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npm-seek{margin-top:18px}
.npm-seek input{width:100%;accent-color:var(--ink);margin:0}
.npm-seek .times{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;margin-top:4px}
.npm-ctrl{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.npm-ctrl .big{width:72px;height:72px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.npm-ctrl .big .ic{width:40px;height:40px}
.npm-ctrl .icon-btn{width:52px;height:52px}
.npm-ctrl .icon-btn .ic{width:30px;height:30px}
.npm-ctrl .icon-btn.side .ic{width:24px;height:24px}
.npm-extra{display:flex;justify-content:center;gap:12px;margin-top:14px}
.pill{height:34px;padding:0 14px;border-radius:17px;background:var(--surface);display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px;color:var(--ink-soft)}
.pill .ic{width:18px;height:18px}
.pill.on{color:var(--accent)}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <button class="icon-btn" id="backBtn" aria-label="Close search"><svg class="ic"><use href="#i-back"/></svg></button>
    <a class="logo" href="#/home" aria-label="Dhun home"><span class="logo-mark"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>Dhun</a>
    <label class="search"><svg class="ic sm"><use href="#i-search"/></svg><input id="q" type="search" placeholder="Search songs, albums, artists, the Internet Archive" autocomplete="off" enterkeyhint="search"></label>
    <div class="top-actions">
      <button class="icon-btn" id="searchToggle" aria-label="Search"><svg class="ic"><use href="#i-search"/></svg></button>
      <button class="icon-btn" id="uploadTop" aria-label="Add music files" title="Add your own music files"><svg class="ic"><use href="#i-upload"/></svg></button>
      <button class="icon-btn" id="themeBtn" aria-label="Switch theme" title="Light / dark"><svg class="ic"><use href="#i-theme"/></svg></button>
    </div>
  </header>

  <aside id="side">
    <nav class="nav">
      <a href="#/home" data-nav="home"><svg class="ic"><use href="#i-home"/></svg>Home</a>
      <a href="#/explore" data-nav="explore"><svg class="ic"><use href="#i-explore"/></svg>Explore</a>
      <a href="#/library" data-nav="library"><svg class="ic"><use href="#i-library"/></svg>Library</a>
    </nav>
    <div class="side-sep"></div>
    <button class="new-pl" data-act="new-playlist"><svg class="ic sm"><use href="#i-add"/></svg>New playlist</button>
    <div class="side-pl" id="sidePl"></div>
  </aside>

  <main id="main"><div id="view"></div></main>

  <footer id="bar" class="empty-bar">
    <div class="seek-top" id="seekTop"><div class="track"><div class="buf" id="bufFill"></div><div class="fill" id="seekFill"></div><div class="knob" id="seekKnob"></div></div></div>
    <div class="ctrl">
      <button class="icon-btn prev" data-act="prev" aria-label="Previous"><svg class="ic"><use href="#i-prev"/></svg></button>
      <button class="play" data-act="toggle" aria-label="Play"><svg class="ic"><use href="#i-play"/></svg></button>
      <button class="icon-btn" data-act="next" aria-label="Next"><svg class="ic"><use href="#i-next"/></svg></button>
      <span class="time" id="barTime">0:00 / 0:00</span>
    </div>
    <div class="now">
      <div class="thumb" data-act="np-open"><img id="barArt" alt=""><div class="loading-ring"></div></div>
      <div class="meta" data-act="np-open"><div class="t" id="barTitle"></div><div class="s" id="barSub"></div></div>
      <button class="icon-btn like-btn hide-m" id="barLike" data-act="like-cur" aria-label="Like"><svg class="ic sm"><use href="#i-heart-o"/></svg></button>
      <button class="icon-btn hide-m" data-act="menu-cur" aria-label="More"><svg class="ic sm"><use href="#i-more"/></svg></button>
    </div>
    <div class="right">
      <div class="vol hide-m"><button class="icon-btn" data-act="mute" id="muteBtn" aria-label="Mute"><svg class="ic sm"><use href="#i-vol"/></svg></button><input type="range" id="vol" min="0" max="100" aria-label="Volume"></div>
      <button class="icon-btn hide-m" data-act="repeat" id="repBtn" aria-label="Repeat" title="Repeat"><svg class="ic sm"><use href="#i-repeat"/></svg></button>
      <button class="icon-btn hide-m" data-act="shuffle" id="shufBtn" aria-label="Shuffle" title="Shuffle"><svg class="ic sm"><use href="#i-shuffle"/></svg></button>
      <button class="icon-btn hide-m" data-act="np-toggle" id="npBtn" aria-label="Open player"><svg class="ic"><use href="#i-up"/></svg></button>
    </div>
  </footer>

  <nav id="nav">
    <a href="#/home" data-nav="home"><svg class="ic"><use href="#i-home"/></svg>Home</a>
    <a href="#/explore" data-nav="explore"><svg class="ic"><use href="#i-explore"/></svg>Explore</a>
    <a href="#/library" data-nav="library"><svg class="ic"><use href="#i-library"/></svg>Library</a>
  </nav>
</div>

<section id="np" aria-label="Now playing">
  <div class="np-bg" id="npBg"></div>
  <div class="np-inner">
    <div class="np-left">
      <div class="np-head">
        <button class="icon-btn" data-act="np-close" aria-label="Close player"><svg class="ic"><use href="#i-down"/></svg></button>
        <span>Now playing</span>
        <button class="icon-btn" data-act="menu-cur" aria-label="More"><svg class="ic"><use href="#i-more"/></svg></button>
      </div>
      <div class="np-art"><img id="npArt" alt=""><canvas id="viz"></canvas><div class="loading-ring"></div></div>
      <div class="np-mobile">
        <div class="npm-title"><div class="meta"><div class="t" id="npmTitle"></div><div class="s" id="npmSub"></div></div>
          <button class="icon-btn like-btn" id="npmLike" data-act="like-cur" aria-label="Like"><svg class="ic"><use href="#i-heart-o"/></svg></button></div>
        <div class="npm-seek"><input type="range" id="npmSeek" min="0" max="1000" value="0" aria-label="Seek"><div class="times"><span id="npmCur">0:00</span><span id="npmDur">0:00</span></div></div>
        <div class="npm-ctrl">
          <button class="icon-btn side" data-act="shuffle" id="npmShuf" aria-label="Shuffle"><svg class="ic"><use href="#i-shuffle"/></svg></button>
          <button class="icon-btn" data-act="prev" aria-label="Previous"><svg class="ic"><use href="#i-prev"/></svg></button>
          <button class="big" data-act="toggle" aria-label="Play"><svg class="ic"><use href="#i-play"/></svg></button>
          <button class="icon-btn" data-act="next" aria-label="Next"><svg class="ic"><use href="#i-next"/></svg></button>
          <button class="icon-btn side" data-act="repeat" id="npmRep" aria-label="Repeat"><svg class="ic"><use href="#i-repeat"/></svg></button>
        </div>
        <div class="npm-extra"><button class="pill" data-act="sleep" id="sleepPillM"><svg class="ic"><use href="#i-timer"/></svg><span>Sleep timer</span></button><button class="pill" data-act="radio-cur"><svg class="ic"><use href="#i-radio"/></svg>Start radio</button></div>
      </div>
    </div>
    <div class="np-right">
      <div class="tabs" role="tablist"><button data-tab="queue" class="on">Up next</button><button data-tab="related">Related</button><button data-tab="about">About</button></div>
      <div class="tab-body" id="tabBody"></div>
    </div>
  </div>
</section>

<div id="scrim"></div>
<div id="menu" role="menu"></div>
<div id="dialog" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>
<div class="drop" id="drop">Drop audio files to add them to your library</div>
<input type="file" id="fileIn" accept="audio/*,.mp3,.m4a,.aac,.ogg,.oga,.opus,.wav,.flac,.webm" multiple hidden>
<audio id="au" preload="auto"></audio>

function probeDuration(blob) {
  return new Promise(function (res) {

    a.preload = 'metadata'; a.onloadedmetadata = function () { done(isFinite(a.duration) ? a.duration : 0); }; a.onerror = function () { done(-1); };
    setTimeout(function () { done(0); }, 8000); a.src = u;

}

  if (!files.length) return toast('No audio files found');

    return pr.then(function () {

        if (m) { artist = m[1].replace(/^\d+[\s.-]*/, ''); title = m[2]; } else title = base.replace(/^\d+[\s.-]+/, '') || base;
        var rec = { id: 'up:' + uid(), title: title, artist: artist || 'Your upload', album: 'Uploads', dur: d, added: Date.now(), blob: f };
        return idb('readwrite', function (st) { st.put(rec); }).then(function () {
          UP[rec.id] = { id: rec.id, src: 'up', title: rec.title, artist: rec.artist, album: rec.album, dur: d, added: rec.added, seed: E.hash(rec.id) }; added.push(rec.id);
        });
      });
    });

  search: function (q) {
    q = (q || '').trim();
    if (!q) return '<h1 class="page-title">Search</h1><div class="chips">' + E.MOODS.map(function (m) { return '<a class="chip" href="#/mix/' + m.id + '">' + esc(m.name) + '</a>'; }).join('') + '</div>';
    var ql = q.toLowerCase(), words = ql.split(/\s+/);
    function score(s) { s = (s || '').toLowerCase(); var w = 0; words.forEach(function (x) { if (s.indexOf(x) >= 0) w += s.indexOf(x) === 0 ? 3 : 2; }); return w; }
    var pool = CAT.tracks.concat(Object.keys(UP).map(function (k) { return UP[k]; }), Object.keys(S.ext).map(function (k) { return S.ext[k]; }));
    var songs = pool.map(function (t) { return { t: t, w: score(t.title) * 2 + score(t.artist) + score(t.album) + score(t.genre ? E.GENRES[t.genre].name : '') }; })
      .filter(function (o) { return o.w > 0; }).sort(function (a, b) { return b.w - a.w; }).slice(0, 12).map(function (o) { return o.t.id; });
    var albums = CAT.albums.filter(function (a) { return score(a.title + ' ' + a.artist + ' ' + E.GENRES[a.genre].name) > 0; });
    var artists = CAT.artists.filter(function (a) { return score(a.name + ' ' + E.GENRES[a.genre].name) > 0; });
    var pls = S.playlists.filter(function (p) { return score(p.name) > 0; });
    var h = '<h1 class="page-title">Results for “' + esc(q) + '”</h1>';
    if (songs.length) h += shelf('Songs', listHTML(songs, { albumCol: true }));
    if (artists.length) h += shelf('Artists', '<div class="scroller">' + artists.map(artistCard).join('') + '</div>');
    if (albums.length) h += shelf('Albums', '<div class="scroller">' + albums.map(albumCard).join('') + '</div>');
    if (pls.length) h += shelf('Your playlists', '<div class="scroller">' + pls.map(function (p) { return cardHTML({ href: '#/playlist/' + p.id, art: plArt(p.id), title: p.name, sub: plural(p.tracks.length, 'song'), play: 'playlist:' + p.id }); }).join('') + '</div>');
    if (!songs.length && !albums.length && !artists.length) h += '<p class="note" style="margin:-6px 0 24px">Nothing in the built-in library matches — see the Internet Archive results below.</p>';
    h += shelf('On the Internet Archive', '<div class="grid-cards" id="iaSearchRes"><div class="spinner"></div></div>', { kicker: 'Free music' });
    return h;
  }
};
function actionsHTML(spec) {
  return '<div class="actions"><button class="btn primary" data-act="playall" data-play="' + esc(spec) + '">' + icon('play') + 'Play</button><button class="btn" data-act="shuffleall" data-play="' + esc(spec) + '">' + icon('shuffle') + 'Shuffle</button>' +
    '<button class="icon-btn" data-act="cmenu" data-play="' + esc(spec) + '" aria-label="More">' + icon('more') + '</button></div>';
}
function notFound() { return '<div class="empty" style="margin-top:40px"><b>Not found</b>This page doesn’t exist any more.<br><a class="btn primary" href="#/home">Go home</a></div>'; }

var iaState = { q: '', coll: 'netlabels' };
function iaFail(el, msg) { el.innerHTML = '<div class="empty" style="grid-column:1/-1;width:100%"><b>Couldn’t reach the Internet Archive</b>' + esc(msg || 'You may be offline.') + ' The built-in library still works without a connection.<br><button class="btn ghost" data-act="ia-retry">Try again</button></div>'; }
var AFTER = {
  home: function () {
    var el = $('#iaHome'); if (!el) return;
    iaSearch('', 'netlabels').then(function (docs) { if (!document.body.contains(el)) return; el.innerHTML = docs.slice(0, 14).map(iaCard).join('') || '<p class="note">No results.</p>'; })
      .catch(function () { if (document.body.contains(el)) el.closest('.shelf').style.display = 'none'; });
  },
  explore: function () {
    $('#iaForm').addEventListener('submit', function (e) { e.preventDefault(); iaState.q = $('#iaQ').value.trim(); runIA(); });
    runIA();
  },
  search: function (q) {
    var el = $('#iaSearchRes'); if (!el) return;
    iaSearch(q, 'all').then(function (docs) { if (!document.body.contains(el)) return; el.innerHTML = docs.slice(0, 18).map(iaCard).join('') || '<p class="note">No matches on the Internet Archive.</p>'; })
      .catch(function (e) { if (document.body.contains(el)) iaFail(el); });
  },
  ia: function (id) {
    var el = $('#iaAlbum');
    iaAlbum(id).then(function (al) {
      if (!document.body.contains(el)) return;
      var ids = al.tracks.map(function (t) { return t.id; }), dur = al.tracks.reduce(function (a, t) { return a + (t.dur || 0); }, 0);
      var h = '<div class="hero"><div class="cover"><img src="https://archive.org/services/img/' + encodeURIComponent(id) + '" alt=""></div><div class="info"><div class="kind">Album • Internet Archive</div><h1>' + esc(al.title) + '</h1>' +
        '<div class="sub">' + esc(al.creator) + (al.year ? ' • ' + esc(al.year) : '') + '</div><div class="sub">' + plural(ids.length, 'song') + (dur ? ' • ' + fmtLong(dur) : '') +
        (al.license ? ' • <a href="' + esc(al.license) + '" target="_blank" rel="noopener">Licence</a>' : '') + ' • <a href="https://archive.org/details/' + encodeURIComponent(id) + '" target="_blank" rel="noopener">archive.org</a></div>' +
        (al.desc ? '<div class="desc">' + esc(al.desc) + (al.desc.length >= 400 ? '…' : '') + '</div>' : '') +
        (ids.length ? actionsHTML('ia:' + id) : '') + '</div></div>';
      h += ids.length ? listHTML(ids, { num: true }) : '<div class="empty"><b>No playable MP3s in this item</b>Try another album.</div>';
      el.innerHTML = h; markRows();
    }).catch(function () { if (document.body.contains(el)) iaFail(el, 'The album couldn’t be loaded.'); });
  }
};
function runIA() {
  var el = $('#iaRes'); if (!el) return;
  el.innerHTML = '<div class="spinner"></div>';
  iaSearch(iaState.q, iaState.coll).then(function (docs) {
    if (!document.body.contains(el)) return;
    el.innerHTML = docs.length ? '<div class="grid-cards">' + docs.map(iaCard).join('') + '</div>' : '<div class="empty"><b>No results</b>Try different words or another collection.</div>';
  }).catch(function () { if (document.body.contains(el)) iaFail(el); });
}

function renderSide() {
  var h = '<a href="#/playlist/liked"><b>Liked songs</b><span>Auto playlist • ' + plural(plTracks('liked').length, 'song') + '</span></a>';
  h += S.playlists.map(function (p) { return '<a href="#/playlist/' + p.id + '"><b>' + esc(p.name) + '</b><span>' + plural(p.tracks.length, 'song') + '</span></a>'; }).join('');
  if (Object.keys(UP).length) h += '<a href="#/library/uploads"><b>Uploads</b><span>' + plural(Object.keys(UP).length, 'song') + ' on this device</span></a>';
  $('#sidePl').innerHTML = h;
}

/* ================= events ================= */
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]'); if (!el) return;
  var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
  switch (act) {
    case 'row': { var k = el.getAttribute('data-li'), i = +el.getAttribute('data-i'); var ids = LISTS[k]; if (!ids) return;
      if (P.queue[P.i] === ids[i] && P.loadedId) { toggle(); return; }
      setQueue(ids, i, { keepFirst: true }); return; }
    case 'qrow': { var qi = +el.getAttribute('data-qi'); if (qi === P.i) toggle(); else loadAt(qi, true); return; }
    case 'open': go(el.getAttribute('data-href')); return;
    case 'playc': case 'playall': case 'shuffleall': {
      e.stopPropagation();
      var spec = el.getAttribute('data-play'), list = idsOf(spec), shuffle = act === 'shuffleall';
      if (list === null) { // IA album not loaded yet
        var aid = spec.slice(3); toast('Loading album…');
        iaAlbum(aid).then(function (al) { var l = al.tracks.map(function (t) { return t.id; }); if (l.length) setQueue(l, 0, { shuffle: shuffle, noShuffle: !shuffle }); else toast('No playable songs in this album'); }).catch(function () { toast('Couldn’t reach the Internet Archive'); });
        return;
      }
      setQueue(list, 0, { shuffle: shuffle, noShuffle: !shuffle && spec.indexOf('artist:') !== 0 }); return; }
    case 'cmenu': { e.stopPropagation(); var sp = el.getAttribute('data-play'), l2 = idsOf(sp) || []; collectionMenu(el, l2, '', []); return; }
    case 'like': e.stopPropagation(); toggleLike(id); return;
    case 'tmenu': e.stopPropagation(); trackMenu(el, id, el.getAttribute('data-ctx')); return;
    case 'toggle': toggle(); return;
    case 'next': next(false); return;
    case 'prev': prev(); return;
    case 'shuffle': toggleShuffle(); return;
    case 'repeat': cycleRepeat(); return;
    case 'mute': au.muted = !au.muted; updateVolIcon(); return;
    case 'like-cur': if (P.queue[P.i]) toggleLike(P.queue[P.i]); return;
    case 'menu-cur': if (P.queue[P.i]) trackMenu(el, P.queue[P.i], ''); return;
    case 'radio-cur': if (P.queue[P.i]) startRadio(P.queue[P.i]); return;
    case 'radio-artist': { var ar = CAT.artistById[id]; startRadio(ar.tracks[Math.floor(Math.random() * ar.tracks.length)]); return; }
    case 'np-open': if (isPhone() || !npOpen) openNP(); else closeNP(); return;
    case 'np-toggle': npOpen ? closeNP() : openNP(); return;
    case 'np-close': closeNP(); return;
    case 'sleep': sleepMenu(el); return;
    case 'new-playlist': promptName('New playlist', '', 'Create').then(function (n) { if (n) { var p = createPlaylist(n, []); go('#/playlist/' + p.id); } }); return;
    case 'rename-pl': { var p = plById(id); promptName('Rename playlist', p.name, 'Save').then(function (n) { if (n) { p.name = n; save(); render(); renderSide(); } }); return; }
    case 'delete-pl': { var p2 = plById(id); confirmDialog('Delete “' + p2.name + '”?', 'The playlist will be removed. The songs stay in your library.', 'Delete').then(function (ok) { if (ok) { S.playlists = S.playlists.filter(function (x) { return x.id !== id; }); save(); renderSide(); go('#/library/playlists'); toast('Playlist deleted'); } }); return; }
    case 'upload': fileIn.click(); return;
    case 'playlist-ids': setQueue(Object.keys(UP).sort(function (a, b) { return UP[b].added - UP[a].added; }), 0); return;
    case 'clear-history': confirmDialog('Clear listening history?', 'Listen again, Replay mix and recommendations will start fresh.', 'Clear').then(function (ok) { if (ok) { S.history = []; save(); render(); } }); return;
    case 'ia-retry': iaSearchCache = {}; render(); return;
  }
});
document.addEventListener('click', function (e) { var c = e.target.closest('[data-iacoll]'); if (c) { iaState.coll = c.getAttribute('data-iacoll'); document.querySelectorAll('[data-iacoll]').forEach(function (x) { x.classList.toggle('on', x === c); }); runIA(); } });
document.addEventListener('contextmenu', function (e) { var r = e.target.closest('.row'); if (r) { e.preventDefault(); trackMenu(r.querySelector('[data-act="tmenu"]') || r, r.getAttribute('data-id'), r.getAttribute('data-ctx')); } });

/* search box */
var qEl = $('#q'), qT = 0;
qEl.addEventListener('input', function () { clearTimeout(qT); var v = qEl.value; qT = setTimeout(function () { if (v.trim()) { var h = '#/search/' + encodeURIComponent(v.trim()); if (route.name === 'search') history.replaceState(null, '', h); else history.pushState(null, '', h); render(); } }, 350); });
qEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') { clearTimeout(qT); if (qEl.value.trim()) go('#/search/' + encodeURIComponent(qEl.value.trim())); qEl.blur(); } if (e.key === 'Escape') qEl.blur(); });
$('#searchToggle').addEventListener('click', function () { $('#top').classList.add('searching'); qEl.focus(); });
$('#backBtn').addEventListener('click', function () { $('#top').classList.remove('searching'); qEl.value = ''; if (route.name === 'search') history.back(); });
$('#uploadTop').addEventListener('click', function () { fileIn.click(); });
$('#themeBtn').addEventListener('click', function () {
  var cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  var nx = cur === 'light' ? 'dark' : 'light'; document.documentElement.setAttribute('data-theme', nx); S.theme = nx; save();
});
if (S.theme) document.documentElement.setAttribute('data-theme', S.theme);

/* keyboard */
document.addEventListener('keydown', function (e) {
  if (e.target.closest('input, textarea') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (dlg.style.display === 'flex') { if (e.key === 'Escape') dlgCancel && dlgCancel(); return; }
  if (menuEl.style.display === 'block') { if (e.key === 'Escape') closeMenu(); return; }
  var k = e.key;
  if (k === ' ' || k === 'k') { e.preventDefault(); toggle(); }
  else if (k === 'ArrowRight' && P.loadedId) { e.preventDefault(); seekTo(au.currentTime + (e.shiftKey ? 30 : 10)); }
  else if (k === 'ArrowLeft' && P.loadedId) { e.preventDefault(); seekTo(au.currentTime - (e.shiftKey ? 30 : 10)); }
  else if (k === 'n' || k === 'j') next(false);
  else if (k === 'p' || k === 'h') prev();
  else if (k === 'l' || k === '+') { if (P.queue[P.i]) toggleLike(P.queue[P.i]); }
  else if (k === 's') toggleShuffle();
  else if (k === 'r') cycleRepeat();
  else if (k === 'm') { au.muted = !au.muted; updateVolIcon(); }
  else if (k === '/') { e.preventDefault(); if (isPhone()) $('#top').classList.add('searching'); qEl.focus(); }
  else if (k === 'Escape' && npOpen) closeNP();
  else if (k === 'ArrowUp' && e.shiftKey) { au.volume = Math.min(1, au.volume + 0.1); volEl.value = au.volume * 100; S.vol = au.volume; save(); }
  else if (k === 'ArrowDown' && e.shiftKey) { au.volume = Math.max(0, au.volume - 0.1); volEl.value = au.volume * 100; S.vol = au.volume; save(); }
});

/* media session */
if ('mediaSession' in navigator) {
  var ms = navigator.mediaSession, hd = function (a, f) { try { ms.setActionHandler(a, f); } catch (e) {} };
  hd('play', function () { toggle(); }); hd('pause', function () { au.pause(); });
  hd('previoustrack', prev); hd('nexttrack', function () { next(false); });
  hd('seekbackward', function (d) { seekTo(au.currentTime - (d.seekOffset || 10)); });
  hd('seekforward', function (d) { seekTo(au.currentTime + (d.seekOffset || 10)); });
  hd('seekto', function (d) { seekTo(d.seekTime); });
}

/* iOS/Safari: unlock the audio element on the first tap so songs that take a moment to compose can still start */
var SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
document.addEventListener('pointerdown', function unlock() {
  document.removeEventListener('pointerdown', unlock, true);
  if (au.getAttribute('src')) return;
  au.src = SILENT; var pr = au.play(); if (pr && pr.then) pr.then(function () { if (au.src === SILENT || au.getAttribute('src') === SILENT) au.pause(); }).catch(function () {});
}, true);

/* Android back button (called by the app shell) */
window.dhunBack = function () {
  if (dlg.style.display === 'flex') { dlgCancel && dlgCancel(); return true; }
  if (menuEl.style.display === 'block') { closeMenu(); return true; }
  if (npOpen) { closeNP(); return true; }
  if ($('#top').classList.contains('searching')) { $('#top').classList.remove('searching'); return true; }
  if (route.name !== 'home' || location.hash.replace(/^#\/?/, '') !== 'home') { if (history.length > 1) history.back(); else go('#/home'); return true; }
  return false;
};
window.addEventListener('popstate', function () { if (npOpen && !/np=1/.test(location.hash)) closeNP(true); });
window.addEventListener('hashchange', function () {
  if (npOpen && !/np=1/.test(location.hash)) closeNP(true);
  var r = parseRoute(); if (r.name + '/' + r.arg !== lastRouteKey || r.name === 'library') render();
});
window.addEventListener('pagehide', function () { saveResume(); saveNow(); });

/* archive.org covers can fail offline: fall back to a drawn cover */
document.addEventListener('error', function (e) {
  var im = e.target; if (!im || im.tagName !== 'IMG' || im.dataset.fb) return;
  im.dataset.fb = '1'; im.src = E.cover(im.getAttribute('src') || 'x', 'upload', 360);
}, true);

/* ================= start ================= */
// prune stored external tracks nothing references any more
(function () {
  var keep = {}; S.likes.concat(S.history, (S.resume && S.resume.queue) || []).forEach(function (x) { keep[x] = 1; });
  S.playlists.forEach(function (p) { p.tracks.forEach(function (x) { keep[x] = 1; }); });
  Object.keys(S.ext).forEach(function (k) { if (!keep[k]) delete S.ext[k]; });
})();
syncModes(); updateVolIcon(); updateSleep();
loadUploads().then(function () {
  if (!location.hash) history.replaceState(null, '', '#/home');
  render(); renderSide();
  if (S.resume && S.resume.queue && S.resume.queue.length) {
    resume(false);
    setTimeout(function () { var t = T(P.queue[P.i]); if (t && t.src === 'gen' && !P.loadedId) E.get(t).catch(function () {}); }, 1500);
  }
  requestAnimationFrame(loop);
});
})();
</script>
</body>
